services:
  postgres:
    image: postgres:17
    ports:
      - "54327:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_db
      TZ: "Asia/Tokyo"
    volumes:
      - rdb-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DB_USER: admin
      DB_PASS: password
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: app_db
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  rdb-data:
